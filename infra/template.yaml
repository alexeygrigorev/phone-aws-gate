AWSTemplateFormatVersion: "2010-09-09"
Description: >
  phone-aws-auth: phone-controlled AWS credential gate. Deploys a DynamoDB
  gate row, a sandbox-only target role, a vendor Lambda that mints short-lived
  STS creds for that role when the gate is open, and a tightly-scoped IAM user
  the phone uses to flip the gate. Deploy this stack in the sandbox account.
  Bearer token is generated by the operator's deploy.sh and only its sha256
  (the gate row key) is passed in.

Parameters:
  ServerTokenHash:
    Type: String
    Description: >-
      sha256(server-bearer-token) in hex. The deploy.sh script generates
      a random bearer locally, computes this hash, and passes it in. The
      raw bearer never enters CloudFormation; only the hash does. The
      hash itself is not sensitive — it's also exposed as the GateRowKey
      output so the phone can read it.
    AllowedPattern: "^[0-9a-f]{64}$"

  SessionDurationSeconds:
    Type: Number
    Default: 900
    MinValue: 900
    MaxValue: 3600
    Description: STS session length the vendor mints. Default 15min (the minimum).

  StackNameTag:
    Type: String
    Default: phone-aws-auth
    Description: Used for resource tagging; do not change.

Resources:

  # ---------------------------------------------------------------------------
  # Gate state
  # ---------------------------------------------------------------------------
  GateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: phone-aws-gate
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  # ---------------------------------------------------------------------------
  # Sandbox target role — the only vendable AWS access
  # ---------------------------------------------------------------------------
  SandboxRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: phone-aws-sandbox-role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt VendorLambdaRole.Arn }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sandbox-default
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Sandbox account only. Narrow this after e2e if desired.
              - Effect: Allow
                Action: "*"
                Resource: "*"
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  # ---------------------------------------------------------------------------
  # Vendor Lambda — mints STS creds when the gate is open
  # ---------------------------------------------------------------------------
  VendorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: phone-aws-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: gate-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt GateTable.Arn
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  VendorAssumePolicy:
    # Separate policy because the role -> assumed-role trust depends on the
    # vendor role existing; we can't put this in VendorLambdaRole inline
    # without a circular reference.
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref VendorLambdaRole
      PolicyName: assume-targets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource:
              - !GetAtt SandboxRole.Arn

  VendorLambda:
    Type: AWS::Lambda::Function
    DependsOn: VendorAssumePolicy
    Properties:
      FunctionName: phone-aws-vendor
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt VendorLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SERVER_TOKEN_HASH: !Ref ServerTokenHash
          SANDBOX_ROLE_ARN: !GetAtt SandboxRole.Arn
          SESSION_DURATION: !Ref SessionDurationSeconds
      Code:
        # Self-contained vendor handler. Kept tight so it inlines cleanly.
        # Mirrors src/phone_aws_auth/handlers/vendor.py.
        ZipFile: |
          import hashlib
          import json
          import os
          import time
          import boto3

          ROLE_ARNS = {"sandbox": os.environ["SANDBOX_ROLE_ARN"]}
          SERVER_TOKEN_HASH = os.environ["SERVER_TOKEN_HASH"]
          SESSION_DURATION = int(os.environ.get("SESSION_DURATION", "900"))
          TABLE = "phone-aws-gate"

          _ddb = boto3.resource("dynamodb").Table(TABLE)
          _sts = boto3.client("sts")


          def _const_eq(a, b):
              if len(a) != len(b):
                  return False
              diff = 0
              for x, y in zip(a, b):
                  diff |= ord(x) ^ ord(y)
              return diff == 0


          def handler(event, context):
              headers = {k.lower(): v for k, v in (event.get("headers") or {}).items()}
              token = (headers.get("authorization") or "").strip()
              if not token:
                  return {"statusCode": 403, "body": "Forbidden"}

              token_hash = hashlib.sha256(token.encode("utf-8")).hexdigest()
              if not _const_eq(token_hash, SERVER_TOKEN_HASH):
                  return {"statusCode": 403, "body": "Forbidden"}

              item = _ddb.get_item(Key={"token_hash": SERVER_TOKEN_HASH}).get("Item")
              now = int(time.time())
              if not item or not item.get("active") or int(item.get("expires_at", 0)) <= now:
                  return {"statusCode": 403, "body": "Gate closed"}

              mode = item.get("mode")
              if mode not in ROLE_ARNS:
                  return {"statusCode": 500, "body": f"Bad mode in row: {mode!r}"}

              resp = _sts.assume_role(
                  RoleArn=ROLE_ARNS[mode],
                  RoleSessionName=f"phone-{mode}-{context.aws_request_id[:8]}",
                  DurationSeconds=SESSION_DURATION,
              )
              c = resp["Credentials"]
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({
                      "AccessKeyId": c["AccessKeyId"],
                      "SecretAccessKey": c["SecretAccessKey"],
                      "Token": c["SessionToken"],
                      "Expiration": c["Expiration"].isoformat(),
                  }),
              }
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  VendorLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref VendorLambda
      AuthType: NONE
      InvokeMode: BUFFERED

  VendorLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VendorLambda
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ---------------------------------------------------------------------------
  # Controller IAM user — the phone (or CLI) authenticates as this user
  # and writes the gate row directly. Policy is locked to a single row.
  # ---------------------------------------------------------------------------
  ControllerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: phone-aws-controller
      Policies:
        - PolicyName: gate-row-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                Resource: !GetAtt GateTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - !Ref ServerTokenHash
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  ControllerAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ControllerUser

Outputs:
  VendorUrl:
    Description: Set this as AWS_CONTAINER_CREDENTIALS_FULL_URI on the remote server.
    Value: !GetAtt VendorLambdaUrl.FunctionUrl

  GateRowKey:
    Description: >-
      The DynamoDB row key — same value you passed in as ServerTokenHash.
      Configure this on the phone (or CLI) as the row it writes/reads.
    Value: !Ref ServerTokenHash

  ControllerAccessKeyId:
    Description: AWS access key ID for the phone-aws-controller IAM user.
    Value: !Ref ControllerAccessKey

  ControllerSecretAccessKey:
    Description: >-
      Secret access key for phone-aws-controller. Visible to anyone with
      stack-describe access on this account. Treat as sensitive.
    Value: !GetAtt ControllerAccessKey.SecretAccessKey

  SandboxRoleArn:
    Description: Sandbox account role ARN used by sandbox mode.
    Value: !GetAtt SandboxRole.Arn

  VendorLambdaRoleArn:
    Description: Principal to allow in an external sandbox role trust policy.
    Value: !GetAtt VendorLambdaRole.Arn
