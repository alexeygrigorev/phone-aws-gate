# Local dev loop: DDB Local + bootstrap + control shim + vendor shim + test-server.
#
# Hardcoded local-dev secrets (not real credentials, do not use in prod):
#   bearer:       local-bearer-token-not-secret
#   token_hash:   sha256(bearer) = 4b3e9fad...534b6
#   HMAC secret:  local-hmac-secret-not-secret
#
# Run from this directory:   docker compose up
# Or from project root:      make dev-up

x-shim-base: &shim-base
  build:
    context: ..
    dockerfile: docker/Dockerfile.shim
  environment: &shim-env
    DDB_ENDPOINT_URL: http://dynamodb-local:8000
    AWS_DEFAULT_REGION: eu-west-1
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    SERVER_TOKEN_HASH: "4b3e9fadaac93f5d99f34f024bdfdcd8921b80d56b554d930d93f32471b534b6"
    PROD_ROLE_ARN: arn:aws:iam::000000000000:role/phone-aws-prod-role
    SANDBOX_ROLE_ARN: arn:aws:iam::000000000000:role/phone-aws-sandbox-role
  volumes:
    - ../src:/app/src:ro
    - ../shims:/app/shims:ro
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      # 18000 on the host (8000 is commonly used by other tools); 8000 in-network.
      - "18000:8000"

  bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bootstrap
    environment:
      DDB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    restart: "no"

  control:
    <<: *shim-base
    command: >
      uvicorn shims.control_shim:app --host 0.0.0.0 --port 8001 --reload
      --reload-dir /app/src --reload-dir /app/shims
    environment:
      <<: *shim-env
      HMAC_SECRET: local-hmac-secret-not-secret
      SKIP_RESOURCE_CHECK: "1"
    ports:
      - "8001:8001"

  vendor:
    <<: *shim-base
    command: >
      uvicorn shims.vendor_shim:app --host 0.0.0.0 --port 8002 --reload
      --reload-dir /app/src --reload-dir /app/shims
    environment:
      <<: *shim-env
      MOCK_STS: "1"
    ports:
      - "8002:8002"

  test-server:
    build:
      context: ./test-server
    # boto3 only allows http:// at loopback or the ECS metadata addresses.
    # Sharing vendor's network namespace lets us reach it via 127.0.0.1.
    # In production, the Lambda Function URL is HTTPS, which is allowlist-exempt.
    network_mode: "service:vendor"
    environment:
      AWS_CONTAINER_CREDENTIALS_FULL_URI: http://127.0.0.1:8002/
      AWS_CONTAINER_AUTHORIZATION_TOKEN: local-bearer-token-not-secret
      AWS_DEFAULT_REGION: eu-west-1
      INTERVAL_SECONDS: "5"
    depends_on:
      - vendor
