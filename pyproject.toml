[project]
name = "phone-aws-auth"
version = "0.1.0"
description = "Toggle AWS access on a remote machine from your phone"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
shim = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
tools = [
    "qrcode[pil]>=7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "moto>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_aws_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
