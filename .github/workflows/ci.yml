name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend (lint + import smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync env
        run: uv sync --all-extras --group dev

      - name: Import smoke (handlers + tools)
        run: |
          uv run python -c "
          from phone_aws_auth import config, gate
          from phone_aws_auth.handlers import vendor
          from shims import vendor_shim
          from tools import phone_client, pair_qr, smoke
          print('all imports ok')
          "

      - name: pytest
        run: uv run pytest tests/ -v

      - name: cfn-lint
        run: |
          uv pip install --no-cache cfn-lint
          uv run cfn-lint infra/template.yaml

      - name: Bash syntax check
        run: bash -n deploy.sh

  android:
    name: Android (test + assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-aws-auth-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator-e2e:
    name: Emulator E2E
    runs-on: ubuntu-latest
    needs: [backend, android]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync env
        run: uv sync --all-extras --group dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run local emulator E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: make e2e

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [android, emulator-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: phone-aws-auth-debug-apk

      - name: Prepare release APK
        run: cp app-debug.apk "phone-aws-auth-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          files: phone-aws-auth-${{ github.ref_name }}-debug.apk
