AWSTemplateFormatVersion: "2010-09-09"
Description: >
  phone-aws-auth: phone-controlled AWS credential and resource gate. Deploys a DynamoDB
  gate table, a sandbox-only target role, a vendor Lambda that mints short-lived
  STS creds for that role when the gate is open and coordinates phone-approved
  resource requests, and a tightly-scoped IAM user the phone uses to flip the gate.

Parameters:
  SessionDurationSeconds:
    Type: Number
    Default: 900
    MinValue: 900
    MaxValue: 3600
    Description: STS session length the vendor mints. Default 15min (the minimum).

  StackNameTag:
    Type: String
    Default: phone-aws-auth
    Description: Used for resource tagging; do not change.

Resources:

  # ---------------------------------------------------------------------------
  # Gate state
  # ---------------------------------------------------------------------------
  GateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: phone-aws-gate
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  # ---------------------------------------------------------------------------
  # Sandbox target role — the only vendable AWS access
  # ---------------------------------------------------------------------------
  SandboxRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: phone-aws-sandbox-role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt VendorLambdaRole.Arn }
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: sandbox-default
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Sandbox account only. Narrow this after e2e if desired.
              - Effect: Allow
                Action: "*"
                Resource: "*"
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  # ---------------------------------------------------------------------------
  # Vendor Lambda — mints STS creds when the gate is open & records pending requests
  # ---------------------------------------------------------------------------
  VendorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: phone-aws-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: gate-read-and-request-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt GateTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt GateTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - "req:*"
                      - "pending:*"
                      - "sms-hb:*"
                      - "sms-code:*"
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  VendorAssumePolicy:
    # Separate policy because the role -> assumed-role trust depends on the
    # vendor role existing; we can't put this in VendorLambdaRole inline
    # without a circular reference.
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref VendorLambdaRole
      PolicyName: assume-targets
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [sts:AssumeRole, sts:TagSession]
            Resource:
              - !GetAtt SandboxRole.Arn

  VendorLambda:
    Type: AWS::Lambda::Function
    DependsOn: VendorAssumePolicy
    Properties:
      FunctionName: phone-aws-vendor
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt VendorLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SANDBOX_ROLE_ARN: !GetAtt SandboxRole.Arn
          SESSION_DURATION: !Ref SessionDurationSeconds
      Code:
        # Self-contained vendor handler. Kept <4KB so it inlines cleanly.
        # Mirrors src/phone_aws_auth/handlers/vendor.py.
        ZipFile: |
          import hashlib,json,logging,os,time,urllib.parse as up,uuid,boto3
          E=os.environ;R={"sandbox":E["SANDBOX_ROLE_ARN"]};D=int(E.get("SESSION_DURATION","900"))
          M="arn:aws:iam::387546586013:role/aws-gate-main-access"
          RS={"aws-sandbox":"sandbox","aws-main":"main","browser":"desktop","sms":"login"}
          log=logging.getLogger(__name__);log.setLevel(logging.INFO)
          _d=boto3.resource("dynamodb").Table("phone-aws-gate");_s=boto3.client("sts")
          def _const_eq(a,b):return len(a)==len(b)and not sum(ord(x)^ord(y)for x,y in zip(a,b))
          def _r(s,b):return{"statusCode":s,"headers":{"Content-Type":"application/json"},"body":b if isinstance(b,str)else json.dumps(b,default=int)}
          def _g(k):return _d.get_item(Key={"token_hash":k},ConsistentRead=True).get("Item")
          def _p(k,**v):_d.put_item(Item={"token_hash":k,**v})
          def _ck(th,rs,sc,s0=0):
           sc,n=(sc or RS.get(rs,"")).strip(),int(time.time())
           for k in(f"grant:{th}:{rs}:{sc}",f"grant:global:{rs}:{sc}",th)if rs in RS else():
            it=_g(k)or{};ex,st=int(it.get("expires_at",0)),int(it.get("started_at",0))
            if it.get("active")and ex>n and st>=s0-5 and(k!=th or rs!="aws-main"or it.get("main_access")is True):
             return{"granted":True,"resource":rs,"scope":sc,"grant_id":str(it.get("grant_id",f"{th}-{st}")),"expires_at":ex}
           return{"granted":False,"resource":rs,"scope":sc}
          def handler(ev,ctx):
           h={k.lower():v for k,v in(ev.get("headers")or{}).items()};t=h.get("authorization","").strip()
           t=t[7:].strip()if t[:7].lower()=="bearer "else t
           if not t:return{"statusCode":403,"body":"Forbidden"}
           th=hashlib.sha256(t.encode()).hexdigest();n=int(time.time());p=ev.get("rawPath")or"/"
           if p=="/requests":
            b=json.loads(ev.get("body")or"{}");w,rs,y,tl=b.get("requester","").strip(),b.get("resource","").strip(),b.get("reason","").strip(),int(b.get("ttl_s",3600))
            if not(w and y and rs in RS and 60<=tl<=86400):return _r(400,"bad")
            sc,id=(b.get("scope")or RS[rs]).strip(),uuid.uuid4().hex[:12]
            rc={"id":id,"host_token_hash":th,"requester":w[:120],"resource":rs,"scope":sc[:80],"reason":y[:300],"ttl_s":tl,"state":"pending","requested_at":n,"expires_at":n+900}
            _p(f"req:{id}",**rc)
            for pk in(f"pending:{th}","pending:global"):_p(pk,requests=([r for r in(_g(pk)or{}).get("requests",[])if r.get("state")=="pending"and int(r.get("expires_at",0))>n]+[rc])[-20:],expires_at=n+86400)
            return _r(201,rc)
           if p[:10]=="/requests/":
            it=_g("req:"+p[10:])
            if not it:return _r(404,"")
            st=it.get("state","pending");c=_ck(it.get("host_token_hash")or th,it["resource"],it["scope"],int(it["requested_at"]))if st=="pending"else{}
            if c.get("granted"):st,it["grant_expires_at"],it["grant_id"]="approved",c["expires_at"],c["grant_id"]
            elif st=="pending"and int(it["expires_at"])<=n:st="expired"
            return _r(200,{**it,"state":st})
           if p=="/check":
            q=dict(ev.get("queryStringParameters")or up.parse_qsl(ev.get("rawQueryString","")))
            return _r(200,_ck(h.get("x-host-row-key")or th,q.get("resource","browser"),q.get("scope","")))
           it=_g(th)
           if not it or not it.get("active")or int(it.get("expires_at",0))<=n:return{"statusCode":403,"body":"Gate closed"}
           if p not in("/","/main"):return{"statusCode":404,"body":"Not found"}
           md=it.get("mode")
           if md not in(*R,"main"):return{"statusCode":500,"body":f"Bad mode in row: {md!r}"}
           wm,ma=p=="/main",it.get("main_access")is True
           if(wm and not ma)or(not wm and md=="main"):return{"statusCode":403,"body":"Account not granted"}
           rq=ctx.aws_request_id[:8];kw=dict(RoleArn=R["sandbox"if wm else md],RoleSessionName=f"phone-{md}-{rq}",DurationSeconds=D)
           gid=str(it.get("grant_id",f"{th}-{it.get('started_at',0)}"))
           if ma:kw["Tags"]=[{"Key":"aws-gate-main","Value":"true"},{"Key":"aws-gate-grant","Value":gid}]
           c=_s.assume_role(**kw)["Credentials"];ak,sk,tk="AccessKeyId","SecretAccessKey","SessionToken"
           if wm:c=boto3.client("sts",aws_access_key_id=c[ak],aws_secret_access_key=c[sk],aws_session_token=c[tk]).assume_role(RoleArn=M,RoleSessionName=f"phone-main-{rq}",DurationSeconds=900)["Credentials"]
           log.info("vend grant_id=%s main_access=%s account=%s",gid,ma,"main"if wm else md)
           return _r(200,{ak:c[ak],sk:c[sk],"Token":c[tk],"Expiration":c["Expiration"].isoformat(),**({"Account":"main"}if wm else{})})
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  VendorLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref VendorLambda
      AuthType: NONE
      InvokeMode: BUFFERED

  VendorLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VendorLambda
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  VendorLambdaUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref VendorLambda
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------------------------------------------------------------------
  # Controller IAM user — the phone (or CLI) authenticates as this user
  # and writes gate rows directly. It can only touch this one gate table.
  # ---------------------------------------------------------------------------
  ControllerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: phone-aws-controller
      Policies:
        - PolicyName: gate-row-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                Resource: !GetAtt GateTable.Arn
      Tags:
        - { Key: stack, Value: !Ref StackNameTag }

  ControllerAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref ControllerUser

Outputs:
  VendorUrl:
    Description: Set this as AWS_CONTAINER_CREDENTIALS_FULL_URI on the remote server.
    Value: !GetAtt VendorLambdaUrl.FunctionUrl

  ControllerAccessKeyId:
    Description: AWS access key ID for the phone-aws-controller IAM user.
    Value: !Ref ControllerAccessKey

  ControllerSecretAccessKey:
    Description: >-
      Secret access key for phone-aws-controller. Visible to anyone with
      stack-describe access on this account. Treat as sensitive.
    Value: !GetAtt ControllerAccessKey.SecretAccessKey

  SandboxRoleArn:
    Description: Sandbox account role ARN used by sandbox mode.
    Value: !GetAtt SandboxRole.Arn

  VendorLambdaRoleArn:
    Description: Principal to allow in an external sandbox role trust policy.
    Value: !GetAtt VendorLambdaRole.Arn
