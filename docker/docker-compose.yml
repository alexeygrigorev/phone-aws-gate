# Local dev loop: DDB Local + bootstrap + vendor shim + test-server.
#
# The phone-side client (tools/phone_client.py) runs on the host and writes
# directly to DDB Local on port 18000 — no control Lambda needed.
#
# Hardcoded local-dev values (not real credentials, do not use in prod):
#   bearer:       local-bearer-token-not-secret
#   row key:      sha256(bearer) = 4b3e9fad...534b6
#
# Run from this directory:   docker compose up
# Or from project root:      make dev-up

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      # 18000 on the host (8000 is commonly used by other tools); 8000 in-network.
      - "18000:8000"

  bootstrap:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bootstrap
    environment:
      DDB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb-local
    restart: "no"

  vendor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.shim
    command: >
      uvicorn shims.vendor_shim:app --host 0.0.0.0 --port 8002 --reload
      --reload-dir /app/src --reload-dir /app/shims
    environment:
      DDB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SANDBOX_ROLE_ARN: arn:aws:iam::000000000000:role/phone-aws-sandbox-role
      STS_ENDPOINT_URL: http://fake-sts:4592/
    volumes:
      - ../src:/app/src:ro
      - ../shims:/app/shims:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      fake-sts:
        condition: service_started
    ports:
      - "8002:8002"

  fake-sts:
    build:
      context: ..
      dockerfile: docker/Dockerfile.shim
    command: uvicorn shims.fake_sts:app --host 0.0.0.0 --port 4592 --reload --reload-dir /app/shims
    volumes:
      - ../shims:/app/shims:ro
    ports:
      - "4592:4592"

  test-server:
    build:
      context: ./test-server
    # boto3 only allows http:// at loopback or the ECS metadata addresses.
    # Sharing vendor's network namespace lets us reach it via 127.0.0.1.
    # In production, the Lambda Function URL is HTTPS, which is allowlist-exempt.
    network_mode: "service:vendor"
    environment:
      AWS_CONTAINER_CREDENTIALS_FULL_URI: http://127.0.0.1:8002/
      AWS_CONTAINER_AUTHORIZATION_TOKEN: local-bearer-token-not-secret
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://fake-sts:4592/
      AWS_ENDPOINT_URL_STS: http://fake-sts:4592/
      STS_ENDPOINT_URL: http://fake-sts:4592/
      INTERVAL_SECONDS: "5"
    depends_on:
      - vendor
